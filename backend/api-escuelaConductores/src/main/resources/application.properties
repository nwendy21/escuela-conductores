spring.application.name=api-escuelaConductores
server.port=${PORT:8081}
# MySQL #
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql= ${SHOW_SQL:true}
spring.datasource.url=jdbc:mysql://${MYSQL_SERVICE:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:bd-escuela}?createDatabaseIfNotExist=true&useSSL=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Admin@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


